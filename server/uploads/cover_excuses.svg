<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="600" height="600">
  <defs>
    <linearGradient id="grad_Punjabi" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="50%" stop-color="#6d28d9" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>
    <radialGradient id="glow_Punjabi" cx="50%" cy="35%" r="40%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="600" height="600" fill="url(#grad_Punjabi)" />
  <rect width="600" height="600" fill="url(#glow_Punjabi)" />

  <!-- Ambient Vinyl Circles -->
  <circle cx="300" cy="220" r="160" fill="none" stroke="rgba(255,255,255,0.08)" stroke-width="40" />
  <circle cx="300" cy="220" r="100" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="12" />
  <circle cx="300" cy="220" r="40" fill="rgba(0,0,0,0.4)" stroke="rgba(255,255,255,0.3)" stroke-width="4" />

  <!-- Center Disc Icon -->
  <text x="300" y="238" font-size="48" text-anchor="middle" fill="#ffffff" filter="url(#shadow)">📽️</text>

  <!-- Soundwave Bars -->
  <g transform="translate(150, 395)" fill="rgba(255,255,255,0.85)">
    <rect x="0" y="15" width="6" height="20" rx="3" />
