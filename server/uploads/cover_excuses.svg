    <rect x="28" y="0" width="6" height="45" rx="3" />
    <rect x="42" y="10" width="6" height="30" rx="3" />
    <rect x="56" y="20" width="6" height="15" rx="3" />
    <rect x="70" y="8" width="6" height="32" rx="3" />
    <rect x="84" y="2" width="6" height="42" rx="3" />
    <rect x="98" y="12" width="6" height="26" rx="3" />
    <rect x="112" y="20" width="6" height="15" rx="3" />
    <rect x="126" y="4" width="6" height="38" rx="3" />
    <rect x="140" y="0" width="6" height="45" rx="3" />
    <rect x="154" y="8" width="6" height="32" rx="3" />
    <rect x="168" y="16" width="6" height="22" rx="3" />
    <rect x="182" y="6" width="6" height="34" rx="3" />
    <rect x="196" y="0" width="6" height="45" rx="3" />
    <rect x="210" y="12" width="6" height="26" rx="3" />
    <rect x="224" y="22" width="6" height="14" rx="3" />
    <rect x="238" y="8" width="6" height="32" rx="3" />
    <rect x="252" y="2" width="6" height="42" rx="3" />
    <rect x="266" y="12" width="6" height="26" rx="3" />
    <rect x="280" y="18" width="6" height="18" rx="3" />
  </g>

  <!-- Tag Pills -->
  <g transform="translate(40, 40)">
    <rect x="0" y="0" width="130" height="34" rx="17" fill="rgba(0,0,0,0.5)" stroke="rgba(255,255,255,0.3)" stroke-width="1" />
    <text x="65" y="22" font-family="Segoe UI, -apple-system, sans-serif" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1.5">PUNJABI</text>
  </g>
  <g transform="translate(440, 40)">
    <rect x="0" y="0" width="120" height="34" rx="17" fill="rgba(255,255,255,0.2)" stroke="rgba(255,255,255,0.35)" stroke-width="1" />
    <text x="60" y="22" font-family="Segoe UI, -apple-system, sans-serif" font-size="11" font-weight="700" fill="#ffffff" text-anchor="middle" letter-spacing="1">🎬 HD VIDEO</text>
  </g>

  <!-- Track Information -->
  <rect x="30" y="440" width="540" height="130" rx="16" fill="rgba(15, 23, 42, 0.85)" stroke="rgba(255, 255, 255, 0.2)" stroke-width="1" filter="url(#shadow)" />

  <text x="50" y="482" font-family="Segoe UI, -apple-system, sans-serif" font-size="24" font-weight="800" fill="#ffffff">Excuses Video Hits</text>
  <text x="50" y="515" font-family="Segoe UI, -apple-system, sans-serif" font-size="16" font-weight="600" fill="#38bdf8">AP Dhillon feat Gurinder</text>
  <text x="50" y="546" font-family="Segoe UI, -apple-system, sans-serif" font-size="14" font-weight="500" fill="#cbd5e1">🎬 Film: Punjabi Hits Deluxe</text>
